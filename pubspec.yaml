name: app
description: "A new Flutter project."

publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  connectivity_plus: ^6.1.3
  fast_cached_network_image: ^1.3.3+5
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_easyloading: ^3.0.5
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.5
  flutter_riverpod: ^3.0.0-dev.3
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  go_transitions: ^0.8.0
  hive_ce: ^2.11.0-pre.4
  hive_ce_flutter: ^2.3.0-pre.1
  http: ^1.3.0
  intl: ^0.19.0
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shimmer: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.0-pre.1

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icons/app-icon-1024x1024.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app-icon-1024x1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/app-icon-1024x1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/app-icon-1024x1024.png"
  # command: dart run flutter_launcher_icons:main

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/splash-icon-384x384.png"
  # background_image: "assets/icons/splash-background.png"
  # background_image_dark: "assets/icons/splash-background.png"
  # branding: "assets/icons/loader.gif"
  # branding_bottom_padding: 64
  android: true
  ios: true
  web: true
  # command: dart run flutter_native_splash:create

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - dotenv
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/svgs/

  fonts:
    - family: Urbanist
      fonts:
        # Extra Heavy Bold
        - asset: assets/fonts/Urbanist-ExtraHeavyBold.ttf
          weight: 900
        - asset: assets/fonts/Urbanist-ExtraHeavyBoldItalic.ttf
          weight: 900
          style: italic
        # Extra Bold
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Urbanist-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        # Bold
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        # Semi Bold
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-SemiBoldItalic.ttf
          weight: 600
          style: italic
        # Medium
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        # Regular
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-RegularItalic.ttf
          weight: 400
          style: italic
        # Light
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-LightItalic.ttf
          weight: 300
          style: italic
        # Extra Light
        - asset: assets/fonts/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Urbanist-ExtraLightItalic.ttf
          weight: 200
          style: italic
        # Thin
        - asset: assets/fonts/Urbanist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Urbanist-ThinItalic.ttf
          weight: 100
          style: italic
